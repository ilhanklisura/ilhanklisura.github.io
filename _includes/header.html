<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav" aria-label="Primary">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />

      <label for="nav-trigger" class="menu-toggle" aria-controls="site-menu" aria-label="Toggle navigation">
        <span class="menu-icon" aria-hidden="true">
          <svg viewBox="0 0 18 15" width="18" height="15">
            <path d="M18,1.5H0" /><path d="M18,7.5H0" /><path d="M18,13.5H0" />
          </svg>
        </span>
        <span class="sr-only">Menu</span>
      </label>

      <div class="trigger" id="site-menu">
        {% assign page_paths = site.header_pages %}
        {% for path in page_paths %}
          {% assign my_page = site.pages | where: "path", path | first %}
          {% if my_page %}
            <a class="page-link {% if page.url == my_page.url %}active{% endif %}"
               href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
          {% endif %}
        {% endfor %}
        <button id="theme-toggle" class="theme-toggle" type="button" onclick="__toggleTheme()" aria-label="Toggle theme">🌙</button>
      </div>
    </nav>
  </div>
</header>
