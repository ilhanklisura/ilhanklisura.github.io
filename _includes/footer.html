<footer class="site-footer" role="contentinfo">
  <div class="wrapper footer-inner">
    <div class="footer-left">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</span>
      <span class="muted">·</span>
      <span class="muted">{{ site.description }}</span>
    </div>
    <div class="footer-right">
      <a class="footer-link" href="mailto:{{ site.email }}">Email</a>
      <a class="footer-link" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
      <a class="footer-link" href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
</footer>
